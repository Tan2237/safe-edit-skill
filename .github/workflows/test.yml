name: test

on:
  push:
  pull_request:

jobs:
  safe-edit:
    name: safe-edit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m py_compile skills/safe-edit/safe_edit.py
      - run: python -m unittest discover -s tests -v
